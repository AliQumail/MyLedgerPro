<ngx-spinner bdColor = "rgba(0, 0, 0, 0.8)" size = "medium" color = "#fff" type="la-ball-scale-multiple" [fullScreen] = "true"><p style="color: white" > Loading... </p></ngx-spinner>

<div *ngIf="name != null" class="dashboard-outer">
  <app-navbar></app-navbar>
  <div class="container">
    <div class="dashboard-header-row">
      <div class="dashboard-greeting">
        <fa-icon [icon]="faHand" class="greeting-icon"></fa-icon>
        Hi {{ name }}!
      </div>
      <div class="dashboard-header-actions">
        <app-add-customer
          (refreshList)="handleRefreshList()"
        ></app-add-customer>
        <app-add-transaction
          [customers]="customers"
          (refreshList)="handleRefreshList()"
        ></app-add-transaction>
      </div>
    </div>
    <div class="row">
      <div class="col col-12 col-lg-3">
        <div class="dashboard-sidebar">
          <div class="stat-card stat-card-give">
            <div class="stat-card-label">To Give (RS)</div>
            <div class="stat-card-value">{{ totalToGive | number }}</div>
          </div>
          <div class="stat-card stat-card-take">
            <div class="stat-card-label">To Take (RS)</div>
            <div class="stat-card-value">{{ totalToTake | number }}</div>
          </div>
        </div>
      </div>
      <div class="col col-12 col-lg-9">
        <div class="dashboard-panel">
          <div class="dashboard-toolbar">
            <div class="form-check form-switch dashboard-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" (change)="onSwitchChange($event)">
              <label class="form-check-label" for="flexSwitchCheckChecked">Graphical view</label>
            </div>
            <div class="dashboard-toolbar-actions">
              <div class="dashboard-search">
                <fa-icon [icon]="faSearch" class="dashboard-search-icon"></fa-icon>
                <input
                  type="text"
                  class="form-control input-field dashboard-search-input"
                  placeholder="Search customers..."
                  [(ngModel)]="searchTerm"
                  (ngModelChange)="onSearchChange($event)"
                />
              </div>
              <button type="button" class="dashboard-pdf-btn" (click)="downloadPdf()">
                <fa-icon [icon]="faFilePdf" class="me-1"></fa-icon>Download PDF
              </button>
            </div>
          </div>
          <div *ngIf="showGraphicalView == 1" class="mt-2">
            <canvas baseChart
            class="w-100"
            [data]="barChartData"
            [options]="barChartOptions"
            [plugins]="barChartPlugins"
            [legend]="barChartLegend"
            [type]="'bar'">
          </canvas>
          </div>
          <div *ngIf="showGraphicalView == 0" class="table-responsive mt-2">
            <table class="table align-middle mb-0 dashboard-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th class="dashboard-sortable-th" (click)="toggleSort('toTake')">
                    To Take
                    <fa-icon [icon]="sortColumn === 'toTake' ? (sortDirection === 'asc' ? faSortUp : faSortDown) : faSort" class="dashboard-sort-icon"></fa-icon>
                  </th>
                  <th class="dashboard-sortable-th" (click)="toggleSort('toGive')">
                    To Give
                    <fa-icon [icon]="sortColumn === 'toGive' ? (sortDirection === 'asc' ? faSortUp : faSortDown) : faSort" class="dashboard-sort-icon"></fa-icon>
                  </th>
                  <th>Details</th>
                  <th>Update</th>
                  <th>Delete</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of filteredSummary">
                  <td>
                    <div class="d-flex align-items-center">
                      <div class="">
                        <p class="fw-bold mb-1">{{ item.customerName }}</p>
                        <p class="text-muted mb-0">
                          {{ item.customerEmail }}
                        </p>
                      </div>
                    </div>
                  </td>
                  <td>
                    <p class="fw-normal mb-1">{{ item.toTake | number }}</p>
                  </td>
                  <td>{{ item.toGive | number }}</td>
                  <td>
                    <button
                      type="button"
                      class="btn-styling-none"
                      (click)="view(item.customerId)"
                    >
                    <fa-icon [icon]="faEye"></fa-icon>
                    </button>
                  </td>
                  <td>
                    <app-update-customer [customer]="item" (refreshList)="handleRefreshList()"></app-update-customer>
                  </td>
                  <td>
                    <button
                    type="button"
                    class="btn-styling-none"
                    (click)="deleteCustomer(item.customerId)"
                  >
                  <fa-icon [icon]="faTrashCan"></fa-icon>
                  </button>
                  </td>
                </tr>
                <tr *ngIf="filteredSummary.length === 0">
                  <td colspan="6" class="text-center dashboard-empty">No Data</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
