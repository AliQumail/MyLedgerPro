<div *ngIf="customer.name != null" class="dashboard-outer">
   <app-navbar></app-navbar>
    <div class="container">
        <div class="dashboard-header-row">
          <div class="dashboard-greeting">Customer: {{ customer.name }}</div>
        </div>
        <div class="row">
          <div class="col col-12 col-lg-3">
            <div class="dashboard-sidebar">
              <div class="stat-card stat-card-give">
                <div class="stat-card-label">To Give (RS)</div>
                <div class="stat-card-value">{{ totalToGive | number }}</div>
              </div>
              <div class="stat-card stat-card-take">
                <div class="stat-card-label">To Take (RS)</div>
                <div class="stat-card-value">{{ totalToTake | number }}</div>
              </div>
            </div>
          </div>
          <div class="col col-12 col-lg-9">
            <div class="dashboard-panel">
              <div class="table-responsive">
                <table class="table align-middle mb-0 dashboard-table">
                  <thead>
                    <tr>
                      <th>Status</th>
                      <th>Amount</th>
                      <th>Date</th>
                      <th>Update</th>
                      <th>Delete</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let tran of transactions">
                      <td>
                        <span class="status-badge" [ngClass]="tran.status === 'Take' ? 'status-badge-take' : 'status-badge-give'">{{tran.status}}</span>
                      </td>
                      <td>{{tran.amount | number}}</td>
                      <td>
                        <span class="dashboard-date-pill">{{tran.date}}</span>
                      </td>
                      <td>
                        <app-update-transaction [transaction]="tran" (refreshList)="handleRefreshList()"></app-update-transaction>
                      </td>
                      <td>
                        <button class="btn-styling-none" (click)='deleteTransaction(tran.id)'><fa-icon [icon]="faTrashCan"></fa-icon></button>
                      </td>
                    </tr>
                    <tr *ngIf="transactions.length === 0">
                      <td colspan="5" class="text-center dashboard-empty">No Data</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
    </div>
  </div>
